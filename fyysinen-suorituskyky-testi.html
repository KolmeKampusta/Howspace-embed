<style>
  /* ============ Design tokens ============ */
  :root {
    --bg: #0c2543;                                   /* page background (dark blue) */
    --container-bg: #ffffff;                          /* main content wrapper */
    --card-bg: #faf8f4;                               /* cards (subtle cream) */

    --blue: #b8d0e3;

    --border-strong: rgba(12, 37, 67, 0.22);

  * { box-sizing: border-box; margin: 0; padding: 0; }

  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    background: var(--container-bg);
    border-radius: var(--radius-lg);
    padding: 28px 28px 32px;
    box-shadow: var(--shadow-lg);
  }

  /* ============ Buttons ============ */
  .btn-primary {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 13px 32px;
    font-family: 'Geist', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    border-radius: 999px;

  }
  .btn-primary:hover {

  }
  .btn-primary:disabled {

  .btn-secondary {

    font-size: 14px;
    font-weight: 500;
    border-radius: 999px;

    transition: all var(--transition);

  .btn-secondary:hover {

  /* ============ Test header ============ */

  /* ============ Level picker (punnerrus) ============ */
  .level-grid {

  /* ============ Timer ============ */

    flex-wrap: wrap;

  .input-label {

  .check-row input {

    height: 17px;

    background: #e0eff9;

    border-radius: var(--radius-sm);

  .level-badge strong {

  }

  .ref-table th {

  .ref-table .lvl {

  /* ============ Navigation ============ */
  .nav-row {
    display: flex;
    gap: 10px;
    justify-content: space-between;

    margin-top: 18px;
    flex-wrap: wrap;
  }

  /* ============ Results ============ */
  .results { text-align: center; }
  .results-eyebrow {
    font-family: 'Geist', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 8px;
    animation: fadeIn 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .results h2 {

    font-weight: 400;
    font-size: clamp(24px, 4.6vw, 38px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    color: var(--navy);
    opacity: 0;
    animation: fadeIn 420ms 80ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .results h2 em {
    font-style: normal;
    font-weight: 400;
    color: var(--navy);
  }
  .results-sub {
    color: var(--navy);
    font-size: 14px;
    max-width: 520px;
    margin: 0 auto 18px;
    opacity: 0;
    animation: fadeIn 420ms 160ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .chart-container {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 12px;
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeIn 540ms 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;

  }
  .scores {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

  }
  .score-card {

  .score-label {

  .score-value {
    font-family: 'Geist', sans-serif;

  .score-value .small {

  /* ============ Language selector ============ */
  .welcome-actions {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  .lang {

    justify-self: start;
    text-align: left;
  }
  .lang-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--border);
    padding: 9px 12px 9px 10px;
    font-family: 'Geist', sans-serif;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.2;
    white-space: nowrap;
    border-radius: 999px;
    cursor: pointer;
    transition: all var(--transition);

    bottom: calc(100% + 8px);

      flex-wrap: wrap-reverse;
      gap: 10px;

      }

      }

  // ============ Language ============
  // Kielet aakkosjärjestyksessä omalla nimellään (latinalaiset, kyrilliset, arabia).

    { code: 'de', name: 'Deutsch' },
    { code: 'en', name: 'English' },
    { code: 'es', name: 'Español' },
    { code: 'fr', name: 'Français' },

  const DEFAULT_LANG = 'fi';
  const LANG_STORAGE_KEY = '3k-kieli';

  // Liput SVG-muodossa, koska emoji-liput eivät näy Windowsissa. {id} korvataan uniikilla tunnisteella.

    fr: '<rect width="30" height="20" fill="#ef4135"/><rect width="20" height="20" fill="#fff"/><rect width="10" height="20" fill="#0055a4"/>',

    so: '<rect width="30" height="20" fill="#4189dd"/><polygon points="15.00,4.80 16.29,8.62 20.33,8.67 17.09,11.08 18.29,14.93 15.00,12.60 11.71,14.93 12.91,11.08 9.67,8.67 13.71,8.62" fill="#fff"/>',
    sv: '<rect width="30" height="20" fill="#006aa7"/><rect x="9.4" width="3.8" height="20" fill="#fecc00"/><rect y="8.1" width="30" height="3.8" fill="#fecc00"/>',

  // Kieli valitaan: ?lang=xx osoitteessa, sitten aiempi valinta, muuten suomi.
  function initialLang() {
    try {
      const fromUrl = new URLSearchParams(window.location.search).get('lang');
      if (fromUrl && I18N[fromUrl]) return fromUrl;
    } catch (e) {
      // Upotuksessa osoitetta ei välttämättä voi lukea
    }
    try {
      const saved = window.localStorage.getItem(LANG_STORAGE_KEY);
      if (saved && I18N[saved]) return saved;
    } catch (e) {
      // localStorage voi olla estetty upotuksessa
    }
    return DEFAULT_LANG;
  }

  function langInfo(code) {
    return LANGS.find(l => l.code === code);
  }

  function langDir() {
    return langInfo(state.lang).rtl ? 'rtl' : 'ltr';
  }

  function ui() {
    return I18N[state.lang].ui;
  }

  // Korvaa {avain}-paikkamerkit annetuilla arvoilla
  function fmt(text, vars) {
    return text.replace(/\{(\w+)\}/g, (m, key) => (key in vars ? vars[key] : m));
  }

  function applyLang() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = langDir();
    document.title = ui().docTitle;
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute('content', ui().docDescription);
  }

  let flagSeq = 0;
  function flagSvg(code) {
    const id = 'flag-clip-' + (++flagSeq);
    return `<span class="lang-flag"><svg viewBox="0 0 30 20" preserveAspectRatio="none" aria-hidden="true" focusable="false">${FLAGS[code].replace(/\{id\}/g, id)}</svg></span>`;
  }

  function renderLangSelector() {
    const current = langInfo(state.lang);
    const options = LANGS.map(l => `
          <li>
            <button type="button" class="lang-option" lang="${l.code}"${l.code === state.lang ? ' aria-current="true"' : ''} onclick="setLang('${l.code}')">
              ${flagSvg(l.code)}<span>${l.name}</span>
            </button>
          </li>`).join('');
    return `
        <div class="lang" id="lang">
          <button type="button" class="lang-toggle" id="lang-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu" aria-label="${ui().language}: ${current.name}" onclick="toggleLangMenu()">
            ${flagSvg(current.code)}
            <span lang="${current.code}">${current.name}</span>
            <svg class="lang-caret" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="lang-menu" id="lang-menu" aria-label="${ui().language}" hidden>${options}
          </ul>
        </div>
    `;
  }

  function toggleLangMenu() {
    const menu = $('lang-menu');
    if (!menu) return;
    if (menu.hidden) openLangMenu();
    else closeLangMenu(false);
  }

  function openLangMenu() {
    const menu = $('lang-menu');
    const toggle = $('lang-toggle');
    menu.hidden = false;
    menu.style.maxHeight = '';
    $('lang').classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');

    // Avaa lista sinne, missä on enemmän tilaa (upotuksen korkeus voi olla rajattu)
    const rect = toggle.getBoundingClientRect();
    const spaceAbove = rect.top - 12;
    const spaceBelow = window.innerHeight - rect.bottom - 12;
    const openDown = spaceBelow >= menu.scrollHeight || spaceBelow > spaceAbove;
    menu.classList.toggle('down', openDown);
    menu.style.maxHeight = Math.max(160, openDown ? spaceBelow : spaceAbove) + 'px';

    const selected = menu.querySelector('[aria-current="true"]') || menu.querySelector('.lang-option');
    selected.focus({ preventScroll: true });
  }

  function closeLangMenu(returnFocus) {
    const menu = $('lang-menu');
    if (!menu || menu.hidden) return;
    menu.hidden = true;
    $('lang').classList.remove('open');
    const toggle = $('lang-toggle');
    toggle.setAttribute('aria-expanded', 'false');
    if (returnFocus) toggle.focus();
  }

  function setLang(code) {
    if (!I18N[code]) return;
    state.lang = code;
    try {
      window.localStorage.setItem(LANG_STORAGE_KEY, code);
    } catch (e) {
      // Valinta toimii silti tämän sivun ajan
    }
    applyLang();
    render();
    const toggle = $('lang-toggle');
    if (toggle) toggle.focus({ preventScroll: true });
  }

  // Sulje lista, kun klikataan tai siirrytään sen ulkopuolelle
  document.addEventListener('click', (e) => {
    const wrap = $('lang');
    if (wrap && !wrap.contains(e.target)) closeLangMenu(false);
  });
  document.addEventListener('focusin', (e) => {
    const wrap = $('lang');
    if (wrap && !wrap.contains(e.target)) closeLangMenu(false);
  });

  // Näppäimistö: Esc sulkee, nuolet liikkuvat listassa
  document.addEventListener('keydown', (e) => {
    const menu = $('lang-menu');
    if (!menu || menu.hidden) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeLangMenu(true);
      return;
    }
    const keys = ['ArrowDown', 'ArrowUp', 'Home', 'End'];
    if (!keys.includes(e.key)) return;
    e.preventDefault();
    const items = Array.from(menu.querySelectorAll('.lang-option'));
    const i = items.indexOf(document.activeElement);
    let next = 0;
    if (e.key === 'End') next = items.length - 1;
    else if (e.key === 'ArrowDown') next = (i + 1) % items.length;
    else if (e.key === 'ArrowUp') next = i <= 0 ? items.length - 1 : i - 1;
    items[next].focus();
  });

  // ============ State ============
  const state = {
    screen: 'welcome',      // 'welcome' | 'test' | 'results'
    lang: initialLang(),
    currentTest: 0,
    results: {},            // id -> { raw, level, opt }
    draft: {},              // id -> { raw, level, easing }
    chartInstance: null
  };

  const timer = {
    intervalId: null,
    phase: 'idle',          // 'idle' | 'lead' | 'run' | 'done'
    remaining: 0,
    leadRemaining: 0
  };

  let audioCtx = null;

  // ============ Helpers ============
  const $ = (id) => document.getElementById(id);

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function beep(freq, dur) {
    try {
      if (audioCtx === null) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {
      // Ääni ei ole kriittinen, jatketaan hiljaisuudessa
    }
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  // Yhdistää testin logiikan ja valitun kielen tekstit
  function getTest(i) {
    return Object.assign({}, TESTS[i], I18N[state.lang].tests[TESTS[i].id]);
  }

  function getTests() {
    return TESTS.map((_, i) => getTest(i));
  }

  // Valitsee kielen mukaisen monikkomuodon, esim. "1 toisto" / "5 toistoa"
  function plural(forms, n) {
    let key = 'other';
    try {
      key = new Intl.PluralRules(state.lang).select(n);
    } catch (e) {
      // Vanha selain: käytetään yleismuotoa
    }
    return fmt(forms[key] || forms.other, { n });
  }

  function getDraft(id) {
    if (!state.draft[id]) state.draft[id] = { raw: '', level: null, easing: false };
    return state.draft[id];
  }

  function startTests() {
    state.screen = 'test';
    state.currentTest = 0;
    state.results = {};
    state.draft = {};
    render();
    scrollToTop();
  }

  // ============ Test screen ============
  function renderTest() {
    const t = getTest(state.currentTest);
    const d = getDraft(t.id);

    const dots = TESTS.map((_, i) => {
      let cls = 'q-progress-dot';
      if (i < state.currentTest) cls += ' done';
      else if (i === state.currentTest) cls += ' current';
      return `<span class="${cls}"></span>`;
    }).join('');

    // Tasovalitsin, vain punnerruksessa
    let levelBlock = '';
    if (t.levels) {
      const opts = t.levels.map((label, i) => {
        const n = i + 1;
        const sel = d.levelChoice === n ? ' selected' : '';
        return `<button class="level-opt${sel}" onclick="selectLevel(${n})">
                  <span class="level-num">${n}</span>
                  <span>${label}</span>
                </button>`;
      }).join('');
      levelBlock = `
        <div class="block">
          <div class="block-title">1. ${ui().chooseLevel}</div>
          <p style="font-size:14px;margin-bottom:12px">${t.levelPrompt}</p>
          <div class="level-grid">${opts}</div>
        </div>
      `;
    }

    const stepNum = t.levels ? 2 : 1;
    const steps = t.steps.map(s => `<li>${s}</li>`).join('');

    // Kevennysvalinta, jos testissä sellainen on
    let easingRow = '';
    if (t.easing) {
      const chk = d.easing === true ? ' checked' : '';

          <input type="checkbox" id="easing" onchange="toggleEasing(this.checked)"${chk} />
          <span>${t.easing}</span>
        </label>
      `;
    }

    // Viitetaulukko
    const headCells = t.tableHead
      ? t.tableHead.map((h, i) => {
          if (t.tableMatrix) {
            return i === 0 ? `<th>${h}</th>` : `<th class="mid">${h}</th>`;
          }
          return `<th>${h}</th>`;
        }).join('')
      : ui().tableHead.map(h => `<th>${h}</th>`).join('');
    const rows = t.table.map(r => {
      if (t.tableMatrix) {
        return `
      <tr>
        <td class="name">${r[0]}</td>
        <td class="mid">${r[1]}</td>
        <td class="mid">${r[2]}</td>
      </tr>
    `;
      }
      return `
      <tr>
        <td class="lvl">${r[0]}</td>
        <td class="val">${r[1]}</td>
        <td>${r[2]}</td>
      </tr>
    `;
    }).join('');

    $('app').innerHTML = `
      <div class="q-header">
        <div class="q-counter">
          ${String(state.currentTest + 1).padStart(2, '0')}
          <span>/ ${String(TESTS.length).padStart(2, '0')}</span>
        </div>
        <div class="q-progress">${dots}</div>
      </div>
      <div class="test">
        <h2 class="test-title">${t.title}</h2>
        <p class="test-sub">${t.sub}</p>

        ${levelBlock}

        <div class="block">
          <div class="block-title">${stepNum}. ${ui().instructions}</div>
          <ul class="info-list numbered">${steps}</ul>
          ${t.tip ? `<p class="info-note">${t.tip}</p>` : ''}
        </div>

        <div class="timer-box" id="timer-box">
          <div class="timer-label" id="timer-label">${ui().timer}</div>
          <div class="timer-display" id="timer-display">${formatTime(t.duration)}</div>
          <div class="timer-btns" id="timer-btns">
            <button class="btn-timer" onclick="startTimer()">${ui().timerStart}</button>
          </div>
        </div>

        <div class="block">
          <div class="block-title">${stepNum + 1}. ${ui().recordResult}</div>
          <div class="input-row">
            <span class="input-label">${t.inputLabel}</span>
            <input class="num-input" type="number" inputmode="numeric" min="0" max="999"
                   id="raw-input" value="${d.raw}" placeholder="0"
                   oninput="setRaw(this.value)" />
          </div>
          ${easingRow}
          <div id="level-out">${renderLevelBadge(t, d)}</div>
        </div>

        <div class="block">
          <div class="block-title">${ui().referenceValues}</div>
          <table class="ref-table">
            <thead><tr>${headCells}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${t.tableNote ? `<p class="info-note">${t.tableNote}</p>` : ''}
          ${t.easingNote ? `<p class="info-note">${t.easingNote}</p>` : ''}
        </div>

        <div class="nav-row">
          ${state.currentTest > 0
            ? `<button class="btn-secondary" onclick="prevTest()">${ui().prev}</button>`
            : '<span></span>'}
          <button class="btn-primary" id="next-btn" onclick="nextTest()" ${canProceedNow() ? '' : 'disabled'}>
            ${state.currentTest === TESTS.length - 1 ? ui().showResults : ui().next}
          </button>
        </div>
      </div>
    `;
  }

  function renderLevelBadge(t, d) {
    if (d.level === null) return '';
    return `<div class="level-badge">${fmt(ui().yourLevel, { n: d.level })}</div>`;
  }

  function recalcLevel() {
    const t = getTest(state.currentTest);
    const d = getDraft(t.id);

    let ready = true;
    if (d.raw === '') ready = false;
    if (isNaN(Number(d.raw))) ready = false;
    if (t.levels) {
      if (!d.levelChoice) ready = false;
    }

    if (ready) {
      d.level = t.levelFn(Number(d.raw), { easing: d.easing, level: d.levelChoice });
    } else {
      d.level = null;
    }

    const out = $('level-out');
    if (out) out.innerHTML = renderLevelBadge(t, d);

    const btn = $('next-btn');
    if (btn) btn.disabled = !canProceedNow();
  }

  function canProceedNow() {
    const t = getTest(state.currentTest);
    const d = getDraft(t.id);
    if (d.raw === '') return false;
    if (isNaN(Number(d.raw))) return false;
    if (Number(d.raw) < 0) return false;
    if (t.levels) {
      if (!d.levelChoice) return false;
    }
    return true;
  }

  function setRaw(val) {
    const t = getTest(state.currentTest);
    const d = getDraft(t.id);
    d.raw = val;
    recalcLevel();
  }

  function toggleEasing(checked) {
    const t = getTest(state.currentTest);
    const d = getDraft(t.id);
    d.easing = checked;
    recalcLevel();
  }

  function selectLevel(n) {
    const t = getTest(state.currentTest);
    const d = getDraft(t.id);
    d.levelChoice = n;
    d.level = null;
    // Päivitä valinnan korostus ilman koko sivun uudelleenpiirtoa
    const btns = document.querySelectorAll('.level-opt');
    btns.forEach((b, i) => {
      if (i + 1 === n) b.classList.add('selected');
      else b.classList.remove('selected');
    });
    recalcLevel();
  }

  // ============ Timer ============
  function stopTimerInterval() {
    if (timer.intervalId !== null) {
      clearInterval(timer.intervalId);
      timer.intervalId = null;
    }
  }

  function updateTimerUI() {
    const box = $('timer-box');
    const label = $('timer-label');
    const display = $('timer-display');
    const btns = $('timer-btns');
    if (!box) return;

    box.classList.remove('running', 'finished');

    if (timer.phase === 'lead') {
      box.classList.add('running');
      label.textContent = ui().timerGetReady;
      display.textContent = timer.leadRemaining;
      btns.innerHTML = '<button class="btn-timer ghost" onclick="resetTimer()">' + ui().timerCancel + '</button>';
      return;
    }
    if (timer.phase === 'run') {
      box.classList.add('running');
      label.textContent = ui().timerGo;
      display.textContent = formatTime(timer.remaining);
      btns.innerHTML = '<button class="btn-timer ghost" onclick="resetTimer()">' + ui().timerStop + '</button>';
      return;
    }
    if (timer.phase === 'done') {
      box.classList.add('finished');
      label.textContent = ui().timerDone;
      display.textContent = ui().timerTimeUp;
      btns.innerHTML = '<button class="btn-timer ghost" onclick="resetTimer()">' + ui().timerReset + '</button>';
      return;
    }
    // idle
    const t = getTest(state.currentTest);
    label.textContent = ui().timer;
    display.textContent = formatTime(t.duration);
    btns.innerHTML = '<button class="btn-timer" onclick="startTimer()">' + ui().timerStart + '</button>';
  }

  function startTimer() {
    const t = getTest(state.currentTest);
    stopTimerInterval();
    timer.phase = 'lead';
    timer.leadRemaining = 3;
    timer.remaining = t.duration;
    updateTimerUI();
    beep(660, 0.12);

    timer.intervalId = setInterval(() => {
      if (timer.phase === 'lead') {
        timer.leadRemaining -= 1;
        if (timer.leadRemaining > 0) {
          beep(660, 0.12);
          updateTimerUI();
          return;
        }
        timer.phase = 'run';
        beep(990, 0.3);
        updateTimerUI();
        return;
      }

      if (timer.phase === 'run') {
        timer.remaining -= 1;
        if (timer.remaining <= 0) {
          timer.phase = 'done';
          stopTimerInterval();
          beep(520, 0.6);
          updateTimerUI();
          const input = $('raw-input');
          if (input) input.focus();
          return;
        }
        if (timer.remaining <= 3) beep(660, 0.1);
        updateTimerUI();
      }
    }, 1000);
  }

  function resetTimer() {
    stopTimerInterval();
    timer.phase = 'idle';
    timer.remaining = 0;
    timer.leadRemaining = 0;
    updateTimerUI();
  }

  // ============ Navigation ============
  function nextTest() {
    const t = getTest(state.currentTest);
    const d = getDraft(t.id);
    if (!canProceedNow()) return;

    state.results[t.id] = {
      raw: Number(d.raw),
      level: d.level,
      easing: d.easing,
      levelChoice: d.levelChoice
    };

    resetTimer();

    if (state.currentTest + 1 < TESTS.length) {
      state.currentTest += 1;
      render();
      scrollToTop();
    } else {
      state.screen = 'results';
      render();
      scrollToTop();
    }
  }

  function prevTest() {
    resetTimer();
    if (state.currentTest > 0) {
      state.currentTest -= 1;
      render();
      scrollToTop();
    }
  }

  // ============ Results ============
  function renderResults() {
    const cards = getTests().map(t => {
      const r = state.results[t.id];
      const reps = plural(ui().reps, r.raw);
      let rawText = reps;
      if (t.levels) rawText = fmt(ui().levelAndReps, { level: r.levelChoice, reps });
      if (r.easing === true) rawText = fmt(ui().eased, { text: rawText });
      return `
        <div class="score-card">
          <span class="score-label">
            ${t.title}
            <span class="score-raw">${rawText}</span>
          </span>
          <span class="score-value">${r.level}<span class="small"> / 5</span></span>
        </div>
      `;
    }).join('');

    $('app').innerHTML = `
      <div class="results">
        <div class="results-eyebrow">${ui().resultsEyebrow}</div>
        <h2>${ui().resultsTitle}</h2>
        <p class="results-sub">${ui().resultsSub}</p>
        <div class="chart-container">
          <div class="chart-wrap">
            <canvas id="radarChart"></canvas>
          </div>
        </div>
        <div class="scores">${cards}</div>

        <div class="results-note">
          ${ui().resultsNote}
        </div>

        <p class="save-note">${ui().saveNote}</p>
        <div class="actions">
          <button class="btn-primary" onclick="downloadChart()">${ui().download}</button>
          <button class="btn-secondary" onclick="restart()">${ui().restart}</button>
        </div>
      </div>
    `;

    requestAnimationFrame(() => drawChart());
  }

  function drawChart() {
    const canvas = $('radarChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const labels = getTests().map(t => t.title);
    const data = getTests().map(t => state.results[t.id].level);

    state.chartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels,
        datasets: [{
          label: ui().datasetLabel,
          data,
          backgroundColor: 'rgba(163, 217, 197, 0.42)',
          borderColor: '#0c2543',
          borderWidth: 2,
          pointBackgroundColor: '#0c2543',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        animation: { duration: 900, easing: 'easeOutCubic' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0c2543',
            padding: 12,
            titleFont: { family: 'Geist', size: 13, weight: '500' },
            bodyFont: { family: 'Geist', size: 13 },
            displayColors: false,
            callbacks: {
              label: (item) => fmt(ui().tooltip, { n: item.formattedValue })
            }
          }
        },
        scales: {
          r: {
            min: 0,
            max: 5,
            ticks: {
              stepSize: 1,
              font: { family: 'Geist', size: 11, weight: '600' },
              color: '#000000',
              backdropColor: 'transparent'
            },
            pointLabels: {
              font: { family: 'Geist', size: 13, weight: '400' },
              color: '#000000',
              padding: 8
            },
            grid: { color: 'rgba(184, 208, 227, 0.55)' },
            angleLines: { color: 'rgba(184, 208, 227, 0.55)' }
          }
        }
      }
    });
  }

  function downloadChart() {
    if (!state.chartInstance) return;
    const sourceCanvas = state.chartInstance.canvas;
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = sourceCanvas.width;
    tempCanvas.height = sourceCanvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.fillStyle = '#ffffff';
    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
    tempCtx.drawImage(sourceCanvas, 0, 0);

    const link = document.createElement('a');
    link.href = tempCanvas.toDataURL('image/png', 1);
    link.download = 'fyysinen-suorituskyky-profiili.png';
    link.click();
  }

  function restart() {
    resetTimer();
    state.screen = 'welcome';
    state.currentTest = 0;
    state.results = {};
    state.draft = {};
    if (state.chartInstance) {
      state.chartInstance.destroy();
      state.chartInstance = null;
    }
    render();
    scrollToTop();
  }

  // ============ Router ============
  function render() {
    if (state.chartInstance) {
      if (state.screen !== 'results') {
        state.chartInstance.destroy();
        state.chartInstance = null;
      }
    }
    if (state.screen === 'welcome') renderWelcome();
    else if (state.screen === 'test') renderTest();
    else if (state.screen === 'results') renderResults();
  }

  // Expose for inline handlers
  window.startTests = startTests;
  window.startTimer = startTimer;
  window.resetTimer = resetTimer;
  window.setRaw = setRaw;
  window.toggleEasing = toggleEasing;
  window.selectLevel = selectLevel;
  window.nextTest = nextTest;
  window.prevTest = prevTest;
  window.downloadChart = downloadChart;
  window.restart = restart;
  window.toggleLangMenu = toggleLangMenu;
  window.setLang = setLang;

  applyLang();
  render();
</script>
</body>
</html>
