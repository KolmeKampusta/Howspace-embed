<script>
(function () {
  function init() {
    var app = document.getElementById('app');
    if (!app) return;
    function nykyinenNakyma() {
      var laskuri = app.querySelector('.q-counter');
      if (laskuri) return laskuri.textContent.replace(/\s+/g, '');
      if (app.querySelector('.results')) return 'tulokset';
      return 'alku';
    }
    function hyppaaAlkuun() {
      try {
        app.scrollIntoView({ block: 'start', behavior: 'smooth' });
      } catch (e) {
        app.scrollIntoView(true);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    var edellinen = nykyinenNakyma();
    new MutationObserver(function () {
      var uusi = nykyinenNakyma();
      if (uusi === edellinen) return;
      edellinen = uusi;
      hyppaaAlkuun();
    }).observe(app, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

  // Kieli valitaan: ?lang=xx osoitteessa, sitten aiempi valinta, muuten suomi.
  function initialLang() {
    try {
      const fromUrl = new URLSearchParams(window.location.search).get('lang');
      if (fromUrl && I18N[fromUrl]) return fromUrl;
    } catch (e) {
      // Upotuksessa osoitetta ei välttämättä voi lukea
    }
    try {
      const saved = window.localStorage.getItem(LANG_STORAGE_KEY);
      if (saved && I18N[saved]) return saved;
    } catch (e) {
      // localStorage voi olla estetty upotuksessa
    }
    return DEFAULT_LANG;
  }

  function langInfo(code) {
    return LANGS.find(l => l.code === code);
  }

  function langDir() {
    return langInfo(state.lang).rtl ? 'rtl' : 'ltr';
  }

  function ui() {
    return I18N[state.lang].ui;
  }

  // Korvaa {avain}-paikkamerkit annetuilla arvoilla
  function fmt(text, vars) {
    return text.replace(/\{(\w+)\}/g, (m, key) => (key in vars ? vars[key] : m));
  }

  function applyLang() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = langDir();
    document.title = ui().docTitle;
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute('content', ui().docDescription);
  }

  let flagSeq = 0;
  function flagSvg(code) {
    const id = 'flag-clip-' + (++flagSeq);
    return `<span class="lang-flag"><svg viewBox="0 0 30 20" preserveAspectRatio="none" aria-hidden="true" focusable="false">${FLAGS[code].replace(/\{id\}/g, id)}</svg></span>`;
  }

  function renderLangSelector() {
    const current = langInfo(state.lang);
    const options = LANGS.map(l => `
          <li>
            <button type="button" class="lang-option" lang="${l.code}"${l.code === state.lang ? ' aria-current="true"' : ''} onclick="setLang('${l.code}')">
              ${flagSvg(l.code)}<span>${l.name}</span>
            </button>
          </li>`).join('');
    return `
        <div class="lang" id="lang">
          <button type="button" class="lang-toggle" id="lang-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu" aria-label="${ui().language}: ${current.name}" onclick="toggleLangMenu()">
            ${flagSvg(current.code)}
            <span lang="${current.code}">${current.name}</span>
            <svg class="lang-caret" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="lang-menu" id="lang-menu" aria-label="${ui().language}" hidden>${options}
          </ul>
        </div>
    `;
  }

  function toggleLangMenu() {
    const menu = $('lang-menu');
    if (!menu) return;
    if (menu.hidden) openLangMenu();
    else closeLangMenu(false);
  }

  function openLangMenu() {
    const menu = $('lang-menu');
    const toggle = $('lang-toggle');
    menu.hidden = false;
    menu.style.maxHeight = '';
    $('lang').classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');

    // Avaa lista sinne, missä on enemmän tilaa (upotuksen korkeus voi olla rajattu)
    const rect = toggle.getBoundingClientRect();
    const spaceAbove = rect.top - 12;
    const spaceBelow = window.innerHeight - rect.bottom - 12;
    const openDown = spaceBelow >= menu.scrollHeight || spaceBelow > spaceAbove;
    menu.classList.toggle('down', openDown);
    menu.style.maxHeight = Math.max(160, openDown ? spaceBelow : spaceAbove) + 'px';

    const selected = menu.querySelector('[aria-current="true"]') || menu.querySelector('.lang-option');
    selected.focus({ preventScroll: true });
  }

  function closeLangMenu(returnFocus) {
    const menu = $('lang-menu');
    if (!menu || menu.hidden) return;
    menu.hidden = true;
    $('lang').classList.remove('open');
    const toggle = $('lang-toggle');
    toggle.setAttribute('aria-expanded', 'false');
    if (returnFocus) toggle.focus();
  }

  function setLang(code) {
    if (!I18N[code]) return;
    state.lang = code;
    try {
      window.localStorage.setItem(LANG_STORAGE_KEY, code);
    } catch (e) {
      // Valinta toimii silti tämän sivun ajan
    }
    applyLang();
    render();
    const toggle = $('lang-toggle');
    if (toggle) toggle.focus({ preventScroll: true });
  }

  // Sulje lista, kun klikataan tai siirrytään sen ulkopuolelle
  document.addEventListener('click', (e) => {
    const wrap = $('lang');
    if (wrap && !wrap.contains(e.target)) closeLangMenu(false);
  });
  document.addEventListener('focusin', (e) => {
    const wrap = $('lang');
    if (wrap && !wrap.contains(e.target)) closeLangMenu(false);
  });

  // Näppäimistö: Esc sulkee, nuolet liikkuvat listassa
  document.addEventListener('keydown', (e) => {
    const menu = $('lang-menu');
    if (!menu || menu.hidden) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      closeLangMenu(true);
      return;
    }
    const keys = ['ArrowDown', 'ArrowUp', 'Home', 'End'];
    if (!keys.includes(e.key)) return;
    e.preventDefault();
    const items = Array.from(menu.querySelectorAll('.lang-option'));
    const i = items.indexOf(document.activeElement);
    let next = 0;
    if (e.key === 'End') next = items.length - 1;
    else if (e.key === 'ArrowDown') next = (i + 1) % items.length;
    else if (e.key === 'ArrowUp') next = i <= 0 ? items.length - 1 : i - 1;
    items[next].focus();
  });

  // ============ State ============
  const state = {
    screen: 'welcome',
    lang: initialLang(),
    currentCategory: 0,
    answers: {},
    chartInstance: null
  };
  let advanceTimeout = null;

  // ============ Helpers ============
  const $ = (id) => document.getElementById(id);
  const answerKey = (c, q) => `${c}-${q}`;

  function categories() {
    return I18N[state.lang].categories;
  }

  function isCategoryComplete(catIdx) {
    const qLen = categories()[catIdx].questions.length;
    for (let q = 0; q < qLen; q++) {
      if (state.answers[answerKey(catIdx, q)] === undefined) return false;
    }
    return true;
  }

  function categoryAverage(catIdx) {
    const qLen = categories()[catIdx].questions.length;
    let sum = 0;
    for (let q = 0; q < qLen; q++) sum += state.answers[answerKey(catIdx, q)] ?? 0;
    return sum / qLen;
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============ Welcome ============
  function renderWelcome() {
    const t = ui();
    const totalQuestions = categories().reduce((acc, c) => acc + c.questions.length, 0);
    $('app').innerHTML = `
      <div class="welcome">
        <svg class="welcome-bg" viewBox="0 0 200 200" aria-hidden="true">
          <g fill="none" stroke="#0c2543" stroke-width="0.6">
            <polygon points="100,20 169,60 169,140 100,180 31,140 31,60" />
            <polygon points="100,50 142,75 142,125 100,150 58,125 58,75" />
            <polygon points="100,80 115,90 115,110 100,120 85,110 85,90" />
            <line x1="100" y1="20" x2="100" y2="180" />
            <line x1="31" y1="60" x2="169" y2="140" />
            <line x1="31" y1="140" x2="169" y2="60" />
          </g>
        </svg>
        <div class="welcome-eyebrow">${t.eyebrow}</div>
        <h1>${t.title}</h1>
        <p>${t.intro}</p>
        <div class="welcome-meta">
          <span>${fmt(t.metaCategories, { n: `<strong>${categories().length}</strong>` })}</span>
          <span class="welcome-meta-sep">·</span>
          <span>${fmt(t.metaQuestions, { n: `<strong>${totalQuestions}</strong>` })}</span>
          <span class="welcome-meta-sep">·</span>
          <span>${fmt(t.metaMinutes, { n: '<strong>6</strong>' })}</span>
        </div>
        <div class="welcome-actions" dir="ltr">
          ${renderLangSelector()}
          <button class="btn-primary" dir="${langDir()}" onclick="startQuestionnaire()">${t.start}</button>
        </div>
      </div>
    `;
  }

  function startQuestionnaire() {
    state.screen = 'questionnaire';
    state.currentCategory = 0;
    state.answers = {};
    render();
    scrollToTop();
  }

  // ============ Questionnaire ============
  function renderQuestionnaire() {
    const cat = categories()[state.currentCategory];
    const dots = categories().map((_, i) => {
      let cls = 'q-progress-dot';
      if (i < state.currentCategory) cls += ' done';
      else if (i === state.currentCategory) cls += ' current';
      return `<span class="${cls}"></span>`;
    }).join('');

    $('app').innerHTML = `
      <div class="q-header">
        <div class="q-counter">
          ${String(state.currentCategory + 1).padStart(2, '0')}
          <span>/ ${String(categories().length).padStart(2, '0')}</span>
        </div>
        <div class="q-progress">${dots}</div>
      </div>
      <div class="q-category">
        <h2 class="q-category-title">${cat.title}</h2>
        <p class="q-category-desc">${cat.description}</p>
        <div class="q-list">
          ${cat.questions.map((q, i) => renderQuestion(state.currentCategory, i, q)).join('')}
        </div>
      </div>
    `;
  }

  function renderQuestion(catIdx, qIdx, text) {
    const selected = state.answers[answerKey(catIdx, qIdx)];
    const answered = selected !== undefined;
    let buttons = '';
    for (let v = 1; v <= 7; v++) {
      const sel = v === selected ? 'selected' : '';
      buttons += `<button class="q-button ${sel}" onclick="setAnswer(${catIdx}, ${qIdx}, ${v})" aria-label="${fmt(ui().answerAria, { n: v })}">${v}</button>`;
    }
    return `
      <div class="q-item ${answered ? 'answered' : ''}" id="q-${catIdx}-${qIdx}">
        <div class="q-text">${text}</div>
        <div class="q-scale">${buttons}</div>
        <div class="q-scale-labels">
          <span>${ui().scaleMin}</span>
          <span>${ui().scaleMax}</span>
        </div>
      </div>
    `;
  }

  function setAnswer(catIdx, qIdx, value) {
    state.answers[answerKey(catIdx, qIdx)] = value;

    const qEl = $(`q-${catIdx}-${qIdx}`);
    if (qEl) {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderQuestion(catIdx, qIdx, categories()[catIdx].questions[qIdx]);
      qEl.replaceWith(wrapper.firstElementChild);
    }

    if (advanceTimeout) clearTimeout(advanceTimeout);
    if (isCategoryComplete(catIdx)) {
      advanceTimeout = setTimeout(() => {
        advanceTimeout = null;
        if (catIdx + 1 < categories().length) {
          state.currentCategory = catIdx + 1;
          render();
          scrollToTop();
        } else {
          state.screen = 'results';
          render();
          scrollToTop();
        }
      }, 900);
    }
  }

  // ============ Results ============
  function renderResults() {
    const cats = categories().map((c, i) => ({
      title: c.title,
      avg: categoryAverage(i)
    }));
    const scoreCards = cats.map(c => `
      <div class="score-card">
        <span class="score-label">${c.title}</span>
        <span class="score-value">${c.avg.toFixed(1)}<span class="small"> / 7</span></span>
      </div>
    `).join('');

    $('app').innerHTML = `
      <div class="results">
        <div class="results-eyebrow">${ui().resultsEyebrow}</div>
        <h2>${ui().resultsTitle}</h2>
        <p class="results-sub">${ui().resultsSub}</p>
        <div class="chart-container">
          <div class="chart-wrap">
            <canvas id="radarChart"></canvas>
          </div>
        </div>
        <div class="scores">${scoreCards}</div>
        <p class="save-note">${ui().saveNote}</p>
        <div class="actions">
          <button class="btn-primary" onclick="downloadChart()">${ui().download}</button>
          <button class="btn-secondary" onclick="restart()">${ui().restart}</button>
        </div>
      </div>
    `;

    requestAnimationFrame(() => drawChart());
  }

  function drawChart() {
    const canvas = $('radarChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const labels = categories().map(c => c.title);
    const data = categories().map((_, i) => categoryAverage(i));

    state.chartInstance = new Chart(ctx, {
      type: 'radar',
      data: {
        labels,
        datasets: [{
          label: ui().datasetLabel,
          data,
          backgroundColor: 'rgba(163, 217, 197, 0.42)',
          borderColor: '#0c2543',
          borderWidth: 2,
          pointBackgroundColor: '#0c2543',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        animation: { duration: 900, easing: 'easeOutCubic' },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0c2543',
            padding: 12,
            titleFont: { family: 'Geist', size: 13, weight: '500' },
            bodyFont: { family: 'Geist', size: 13 },
            displayColors: false,
            callbacks: {
              label: (item) => `${item.formattedValue} / 7`
            }
          }
        },
        scales: {
          r: {
            min: 1,
            max: 7,
            ticks: {
              stepSize: 1,
              font: { family: 'Geist', size: 10 },
              color: '#0c2543',
              backdropColor: 'transparent'
            },
            pointLabels: {
              font: { family: 'Geist', size: 13, weight: '400' },
              color: '#0c2543',
              padding: 8
            },
            grid: { color: 'rgba(184, 208, 227, 0.55)' },
            angleLines: { color: 'rgba(184, 208, 227, 0.55)' }
          }
        }
      }
    });
  }

  function downloadChart() {
    if (!state.chartInstance) return;
    const sourceCanvas = state.chartInstance.canvas;
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = sourceCanvas.width;
    tempCanvas.height = sourceCanvas.height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.fillStyle = '#ffffff';
    tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
    tempCtx.drawImage(sourceCanvas, 0, 0);

    const link = document.createElement('a');
    link.href = tempCanvas.toDataURL('image/png', 1);
    link.download = 'muutosvalmius-profiili.png';
    link.click();
  }

  function restart() {
    state.screen = 'welcome';
    state.currentCategory = 0;
    state.answers = {};
    if (state.chartInstance) {
      state.chartInstance.destroy();
      state.chartInstance = null;
    }
    render();
    scrollToTop();
  }

  function render() {
    if (state.chartInstance && state.screen !== 'results') {
      state.chartInstance.destroy();
      state.chartInstance = null;
    }
    if (state.screen === 'welcome') renderWelcome();
    else if (state.screen === 'questionnaire') renderQuestionnaire();
    else if (state.screen === 'results') renderResults();
  }

  window.startQuestionnaire = startQuestionnaire;
  window.setAnswer = setAnswer;
  window.downloadChart = downloadChart;
  window.restart = restart;
  window.toggleLangMenu = toggleLangMenu;
  window.setLang = setLang;

  applyLang();
  render();
</script>
</body>
</html>
